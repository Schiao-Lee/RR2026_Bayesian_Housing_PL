name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint tools
        run: pip install ruff pyyaml

      - name: Lint Python (pyflakes rules only)
        run: ruff check --select F src/

      - name: Validate environment.yml
        run: python -c "import yaml; yaml.safe_load(open('environment.yml'))"
